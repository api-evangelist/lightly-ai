- FOCUS
description: >-
  FinOps view of LightlyOne platform spend. Lightly bills via plan
  subscription (free Community, paid Team, custom Enterprise) rather than a
  granular per-call meter, so cost is driven by the chosen tier and the
  dataset-size / media / collaboration entitlements it unlocks. The main cost
  levers are input dataset volume, LightlyOne Worker compute-run frequency, and
  cloud-storage egress on the customer's own S3 / GCS / Azure datasource (paid
  to the cloud provider, not Lightly). The open-source `lightly` SDK is free.
  Figures are not reconciled against a current rate card.
notes: >-
  Lightly does not publish a public usage-metered rate card; Enterprise is
  quoted by sales. Treat meters below as cost-allocation dimensions for
  internal tracking rather than billed line items, and verify on reconciliation.
sources:
- https://www.lightly.ai/pricing
- https://docs.lightly.ai/
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Lightly
serviceCategory: AI and Machine Learning
billingModel:
  pricingCategory: Subscription-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
focusColumns:
  ServiceName: LightlyOne
  ServiceCategory: AI and Machine Learning
  ProviderName: Lightly
  PublisherName: Lightly
  InvoiceIssuerName: Lightly
  BillingCurrency: USD
  ChargeCategory: Usage
