meters:
- name: plan_subscription
  description: Monthly platform subscription for the selected tier (Team / Enterprise).
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - plan
- name: input_dataset_samples
  description: Number of input samples curated, bounded by the plan dataset-size quota.
  unit: samples
  aggregation: max
  dimensions:
  - account
  - dataset
- name: worker_runs
  description: LightlyOne Worker selection / active-learning compute runs executed.
  unit: runs
  aggregation: sum
  dimensions:
  - account
  - dataset
  - worker
- name: stored_data_bytes
  description: Data and embeddings stored against the platform / datasource.
  unit: bytes
  aggregation: max
  dimensions:
  - account
  - dataset
- name: datasource_egress_bytes
  description: Cloud-storage egress on the customer datasource (billed by the cloud provider, not Lightly).
  unit: bytes
  aggregation: sum
  dimensions:
  - account
  - datasource
principles:
- name: Visibility
  description: Track input dataset size against the plan quota and count worker runs per dataset to understand cost drivers.
- name: Allocation
  description: Tag datasets and worker labels per team / project to map platform spend to cost centers.
- name: Optimization
  description: Right-size selection runs (fewer, well-configured runs over broad re-runs); keep datasource and Lightly compute in the same cloud region to limit egress; use the free OSS SDK for offline experimentation.
- name: Accountability
  description: Assign dataset / project owners and review tier entitlement vs. actual dataset volume before renewal.
