    - GET    https://api.lightly.ai/v1/datasets/{datasetId}
    - PUT    https://api.lightly.ai/v1/datasets/{datasetId}
    - DELETE https://api.lightly.ai/v1/datasets/{datasetId}
    - GET    https://api.lightly.ai/v1/datasets/{datasetId}/children
    - GET    https://api.lightly.ai/v1/datasets/query/name/{datasetName}
    - PUT    https://api.lightly.ai/v1/datasets/{datasetId}/registerDatasetUpload
    - GET    https://api.lightly.ai/v1/datasets/{datasetId}/samples
    - POST   https://api.lightly.ai/v1/datasets/{datasetId}/samples
    - GET    https://api.lightly.ai/v1/datasets/{datasetId}/samples/{sampleId}
    - PUT    https://api.lightly.ai/v1/datasets/{datasetId}/samples/{sampleId}
    - GET    https://api.lightly.ai/v1/datasets/{datasetId}/samples/{sampleId}/readurl
    - GET    https://api.lightly.ai/v1/datasets/{datasetId}/samples/{sampleId}/writeurl
    - GET    https://api.lightly.ai/v1/datasets/{datasetId}/embeddings
    - DELETE https://api.lightly.ai/v1/datasets/{datasetId}/embeddings/{embeddingId}
    - GET    https://api.lightly.ai/v1/datasets/{datasetId}/embeddings/writeCSVUrl
    - GET    https://api.lightly.ai/v1/datasets/{datasetId}/embeddings/{embeddingId}/readCSVUrl
    - POST   https://api.lightly.ai/v1/datasets/{datasetId}/embeddings/{embeddingId}/trigger2dEmbeddingsJob
    - GET    https://api.lightly.ai/v1/datasets/{datasetId}/datasource
    - GET    https://api.lightly.ai/v1/datasets/{datasetId}/datasource/processedUntilTimestamp
    - GET    https://api.lightly.ai/v1/datasets/{datasetId}/datasource/list
    - GET    https://api.lightly.ai/v1/docker/worker/default
    - POST   https://api.lightly.ai/v1/datasets/{datasetId}/docker/worker/schedule
    - GET    https://api.lightly.ai/v1/docker/runs
    - GET    https://api.lightly.ai/v1/docker/runs/{runId}/artifacts/{artifactId}
    - GET    https://api.lightly.ai/v1/jobs
    - GET    https://api.lightly.ai/v1/jobs/{jobId}
    - POST   https://api.lightly.ai/v1/datasets/{datasetId}/tags
