sources:
  - url: https://docs.lightly.ai/
    type: Documentation
    note: LightlyOne platform docs; describes datasets, embeddings, selection, datasources.
  - url: https://docs.lightly.ai/lightly.api.html
    type: APIReference
    note: ApiWorkflowClient reference - the client over the platform REST API.
  - url: https://github.com/lightly-ai/lightly
    type: GitHub
    note: OSS SDK; bundles lightly.openapi_generated.swagger_client confirming exact paths/verbs and base host https://api.lightly.ai.
  - url: https://www.lightly.ai/
    type: Website
    note: Product surfaces - LightlyOne, LightlyTrain, LightlyEdge.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No streaming/WebSocket protocol surface exists, and asynchronous work is
    delivered as pollable REST jobs/docker runs rather than SSE, so no AsyncAPI
    document was authored. The catalog distinguishes the free OSS SDK from the
    hosted LightlyOne platform REST API throughout.
