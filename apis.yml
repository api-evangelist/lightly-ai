aid: lightly-ai
url: https://raw.githubusercontent.com/api-evangelist/lightly-ai/refs/heads/main/apis.yml
name: Lightly
kind: company
description: Lightly is a data-curation and active-learning platform for computer
  vision. The LightlyOne platform exposes a REST API at https://api.lightly.ai for
  managing datasets, samples, embeddings, cloud datasources, selection / active-learning
  runs (the LightlyOne Worker), tags, and jobs. Lightly also maintains the open-source
  lightly self-supervised learning SDK, plus LightlyTrain and LightlyEdge products.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
