    type: APIReference
  - url: openapi/lightly-ai-openapi.yml
    type: OpenAPI
  - url: collections/lightly-ai.postman_collection.json
    type: Postman
  - url: https://github.com/lightly-ai/lightly
    type: GitHub
  description: Create, list, update, and delete LightlyOne datasets (image, video,
    crop, and embedding dataset types), look datasets up by name, query child datasets,
    and register dataset uploads on the LightlyOne platform.
- aid: lightly-ai:lightly-samples-embeddings-api
  name: Lightly Samples and Embeddings API
