- aid: lightly-ai:lightly-oss-sdk
  name: Lightly Self-Supervised Learning SDK (OSS)
  tags:
  - SDK
  - Open Source
  - Self-Supervised Learning
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.lightly.ai/self-supervised-learning/
  baseURL: https://github.com/lightly-ai/lightly
  properties:
  - url: https://docs.lightly.ai/self-supervised-learning/
    type: Documentation
  - url: https://github.com/lightly-ai/lightly
    type: GitHub
  description: The open-source (Apache-2.0) lightly Python library for self-supervised
    representation learning on images (SimCLR, MoCo, DINO, BYOL, and more). It is a
    pip-installable PyTorch SDK and is distinct from the hosted LightlyOne platform
    REST API; the same package also ships the ApiWorkflowClient used to call the platform.
