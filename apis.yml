  properties:
  - url: https://docs.lightly.ai/docs/set-up-your-first-dataset
    type: Documentation
  - url: https://docs.lightly.ai/lightly.api.html
    type: APIReference
  - url: openapi/lightly-ai-openapi.yml
    type: OpenAPI
  - url: collections/lightly-ai.postman_collection.json
    type: Postman
  - url: https://github.com/lightly-ai/lightly
    type: GitHub
  description: Configure and inspect the cloud datasource backing a dataset (S3, GCS,
