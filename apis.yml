    type: Documentation
  - url: https://docs.lightly.ai/lightly.api.html
    type: APIReference
  - url: openapi/lightly-ai-openapi.yml
    type: OpenAPI
  - url: collections/lightly-ai.postman_collection.json
    type: Postman
  - url: https://github.com/lightly-ai/lightly
    type: GitHub
  description: Manage samples within a dataset (create, list, read, update) with signed
    read / write URLs, and manage embeddings - list, delete, request signed CSV read
    / write URLs, mark embeddings processed, and trigger 2D embedding projection jobs.
- aid: lightly-ai:lightly-datasources-api
